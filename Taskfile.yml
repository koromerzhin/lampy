version: 3

# Taskfile principal - Tâches globales et inclusions
# Charge automatiquement les variables depuis le fichier .env s'il existe
dotenv: [ '.env' ]

includes:
  docker: ./taskfiles/docker/Taskfile.yml
  utils: ./taskfiles/utils/Taskfile.yml
  env: ./taskfiles/env/Taskfile.yml
  nodejs: ./taskfiles/nodejs/Taskfile.yml
  download: ./taskfiles/download/Taskfile.yml
  lint: ./taskfiles/lint/Taskfile.yml

vars:
  # Variables avec valeurs par défaut depuis .env ou valeurs de fallback.
  # Adresses Swarm adaptées au poste de dev (voir .env.example) :
  # `docker info -f '{{.Swarm.NodeAddr}}'` pour trouver la vôtre.
  PROJECT_NAME: '{{.PROJECT_NAME | default "lampy"}}'
  ENVIRONMENT: '{{.ENVIRONMENT | default "development"}}'
  SWARM_DEFAULT_ADDR_POOL: '{{.IPSWARM | default "10.20.0.0/16"}}'
  SWARM_ADVERTISE_ADDR: '{{.ADVERTISEADDR | default "192.168.1.46"}}'
  STACK_NAME: '{{.STACK | default "lampy"}}'

tasks:
  default:
    desc: "Affiche l'aide et les tâches disponibles"
    silent: true
    cmds:
    - echo "🛠️  Collection de Taskfiles pour lampy"
    - echo ""
    - echo "Tâches globales disponibles :"
    - task --list
    - echo ""

  lint:all:
    desc: "Exécute tous les linters disponibles"
    cmds:
    - task: lint:yml
      vars:
        IGNORE_DIR: "taskfiles"
    - task: lint:md
      vars:
        IGNORE_DIR: "taskfiles"
    - task: lint:action
    - task: lint:docker

  info:
    desc: "Affiche les informations du projet avec les variables d'environnement"
    silent: true
    cmds:
    - |
      export PROJECT_VERSION=$(jq -r .version package.json)
      echo "🛠️  {{.PROJECT_NAME}} v$PROJECT_VERSION - Stack lampy locale"
      echo "Environnement: {{.ENVIRONMENT}}"

  help:
    desc: "Affiche l'aide détaillée"
    aliases: [ h ]
    cmds:
    - task: default

  lampy:swarm-init:
    desc: "Initialise le projet en exécutant les tâches d'initialisation"
    silent: true
    cmds:
    - task: docker:swarm:init

  lampy:create-network:
    desc: "Crée les réseaux Docker nécessaires au projet"
    silent: true
    cmds:
    - task: docker:network:create
      vars:
        NETWORK_NAME: proxylampy
        NETWORK_DRIVER: overlay
    - task: docker:network:create
      vars:
        NETWORK_NAME: serverlampy
        NETWORK_DRIVER: overlay

  lampy:getpull-image:
    desc: "Télécharge les images Docker définies dans le docker-compose.yml (échec rapide si un pull échoue)"
    silent: true
    summary: |
      Pré-télécharge toutes les images du compose pour éviter les timeouts
      au déploiement. Échoue vite et fort (contrairement à
      `docker:images:pull` qui tolère les échecs avec un simple avertissement
      et laisse ensuite `lampy:waiting` expirer sans diagnostic).

      Variables:
      - COMPOSE_FILE: fichier compose (défaut: ./docker-compose.yml)
    vars:
      COMPOSE_FILE: '{{.COMPOSE_FILE | default "./docker-compose.yml"}}'
    cmds:
    - docker compose -f {{.COMPOSE_FILE}} pull

  lampy:deploy:
    desc: "Déploie les stacks Docker définies dans les fichiers docker-compose"
    silent: true
    cmds:
    - task: docker:stack:deploy
      vars:
        COMPOSE_FILE: ./docker-compose.yml
        STACK_NAME: "{{.STACK_NAME}}"

  lampy:waiting:
    desc: "Attend que les services soient opérationnels"
    silent: true
    cmds:
    - task: docker:stack:check:containers:ready
      vars:
        SERVICES: "mercure,redis,mariadb,mailtest,phpmyadmin,portainer,traefik"
        STACK_NAME: "{{.STACK_NAME}}"

  lampy:ls:
    desc: "Liste les stacks et services Docker"
    silent: true
    cmds:
    - task: docker:stack:services
      vars:
        STACK_NAME: "{{.STACK_NAME}}"

  lampy:exec:
    desc: "Déploie la stack lampy complète (swarm, réseaux, images, deploy, attente, liste)"
    cmds:
    - '[ -f .env ] || cp .env.example .env'
    - task: env:validate
    - task: lampy:swarm-init
    - task: lampy:create-network
    - task: lampy:getpull-image
    - task: lampy:deploy
    - task: lampy:waiting
    - task: lampy:ls

  lampy:dashboard-password:
    desc: "Change le mot de passe du dashboard Traefik (basic-auth)"
    silent: true
    summary: |
      Régénère le hash APR1 du middleware `dashboard-auth` dans
      `traefik/middlewares.yml` (pas de backup `.bak` : fichier suivi,
      `git diff` fait foi — annulation via `git checkout -- <fichier>`).

      Variables:
      - DASHBOARD_USER: login (défaut: admin)
      - DASHBOARD_PASSWORD: mot de passe (demandé en interactif, masqué ;
        requis en non-interactif — passé en var, il reste dans l'historique
        shell, préférez le prompt)
      - MIDDLEWARES_FILE: fichier à mettre à jour
        (défaut: ./traefik/middlewares.yml)

      Exemples:
      task lampy:dashboard-password
      task lampy:dashboard-password DASHBOARD_PASSWORD='mon-secret'

      Après changement : redéployer (`task lampy:deploy`), le provider
      `file` de Traefik ne recharge pas à chaud sans `watch: true`.
    vars:
      DASHBOARD_USER: '{{.DASHBOARD_USER | default "admin"}}'
      DASHBOARD_PASSWORD: '{{.DASHBOARD_PASSWORD | default ""}}'
      MIDDLEWARES_FILE: '{{.MIDDLEWARES_FILE | default "./traefik/middlewares.yml"}}'
    preconditions:
    - sh: command -v openssl
      msg: "openssl n'est pas installé (requis pour générer le hash APR1)"
    - sh: test -f {{.MIDDLEWARES_FILE}}
      msg: "Fichier {{.MIDDLEWARES_FILE}} introuvable"
    cmds:
    - |
      password="{{.DASHBOARD_PASSWORD}}"
      if [ -z "$password" ]; then
        if [ ! -t 0 ]; then
          echo "❌ DASHBOARD_PASSWORD est requis en non-interactif"
          exit 1
        fi
        printf "Mot de passe pour '{{.DASHBOARD_USER}}' : "
        read -r -s password
        echo ""
        printf "Confirmer le mot de passe : "
        read -r -s password_confirm
        echo ""
        if [ "$password" != "$password_confirm" ]; then
          echo "❌ Les mots de passe ne correspondent pas"
          exit 1
        fi
      fi
      if [ -z "$password" ]; then
        echo "❌ Mot de passe vide refusé"
        exit 1
      fi

      hash="$(openssl passwd -apr1 "$password")"
      # Le hash APR1 contient / . $ : délimiteur # choisi en conséquence ;
      # vérification en chaînes fixes (grep -F), sans regex.
      sed -i -E "s#^([[:space:]]*-[[:space:]]*'){{.DASHBOARD_USER}}:[^']*#\1{{.DASHBOARD_USER}}:$hash#" "{{.MIDDLEWARES_FILE}}"
      if grep -qF "{{.DASHBOARD_USER}}:$hash" "{{.MIDDLEWARES_FILE}}"; then
        echo "✅ Mot de passe '{{.DASHBOARD_USER}}' mis à jour dans {{.MIDDLEWARES_FILE}}"
        echo "💡 Redéployez pour appliquer : task lampy:deploy"
      else
        echo "❌ Échec de la mise à jour (ligne '{{.DASHBOARD_USER}}:' introuvable ?)"
        exit 1
      fi

  lampy:bash:
    desc: "Ouvre un shell bash dans le conteneur MariaDB"
    internal: true
    silent: true
    vars:
      CONTAINER: '{{.CONTAINER | default ""}}'
    cmds:
    - task: docker:stack:shell
      vars:
        STACK_NAME: "{{.STACK_NAME}}"
        SERVICE_NAME: "{{.CONTAINER}}"

  bash:mariadb:
    desc: "Ouvre un shell bash dans le conteneur MariaDB"
    silent: true
    cmds:
    - task: lampy:bash
      vars:
        CONTAINER: mariadb

  bash:mercure:
    desc: "Ouvre un shell bash dans le conteneur Mercure"
    silent: true
    cmds:
    - task: lampy:bash
      vars:
        CONTAINER: mercure

  bash:redis:
    desc: "Ouvre un shell bash dans le conteneur Redis"
    silent: true
    cmds:
    - task: lampy:bash
      vars:
        CONTAINER: redis

  bash:mailtest:
    desc: "Ouvre un shell bash dans le conteneur MailTest"
    silent: true
    cmds:
    - task: lampy:bash
      vars:
        CONTAINER: mailtest

  bash:phpmyadmin:
    desc: "Ouvre un shell bash dans le conteneur phpMyAdmin"
    silent: true
    cmds:
    - task: lampy:bash
      vars:
        CONTAINER: phpmyadmin

  bash:portainer:
    desc: "Ouvre un shell bash dans le conteneur Portainer"
    silent: true
    cmds:
    - task: lampy:bash
      vars:
        CONTAINER: portainer

  bash:traefik:
    desc: "Ouvre un shell bash dans le conteneur Traefik"
    silent: true
    cmds:
    - task: lampy:bash
      vars:
        CONTAINER: traefik
