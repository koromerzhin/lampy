version: 3

# Taskfile principal - Tâches globales et inclusions
# Charge automatiquement les variables depuis le fichier .env s'il existe
dotenv: [ '.env' ]

includes:
  docker: ./taskfiles/docker/Taskfile.yml
  utils: ./taskfiles/utils/Taskfile.yml
  env: ./taskfiles/env/Taskfile.yml
  nodejs: ./taskfiles/nodejs/Taskfile.yml
  download: ./taskfiles/download/Taskfile.yml
  lint: ./taskfiles/lint/Taskfile.yml

vars:
  # Variables avec valeurs par défaut depuis .env ou valeurs de fallback.
  # Adresses Swarm adaptées au poste de dev (voir .env.example) :
  # `docker info -f '{{.Swarm.NodeAddr}}'` pour trouver la vôtre.
  PROJECT_NAME: '{{.PROJECT_NAME | default "lampy"}}'
  ENVIRONMENT: '{{.ENVIRONMENT | default "development"}}'
  SWARM_DEFAULT_ADDR_POOL: '{{.IPSWARM | default "10.20.0.0/16"}}'
  SWARM_ADVERTISE_ADDR: '{{.ADVERTISEADDR | default "192.168.1.46"}}'
  STACK_NAME: '{{.STACK | default "lampy"}}'

tasks:
  default:
    desc: "Affiche l'aide et les tâches disponibles"
    silent: true
    cmds:
    - echo "🛠️  Collection de Taskfiles pour lampy"
    - echo ""
    - echo "Tâches globales disponibles :"
    - task --list
    - echo ""

  lint:all:
    desc: "Exécute tous les linters disponibles"
    cmds:
    - task: lint:yml
      vars:
        IGNORE_DIR: "taskfiles"
    - task: lint:md
      vars:
        IGNORE_DIR: "taskfiles"
    - task: lint:action
    - task: lint:docker

  info:
    desc: "Affiche les informations du projet avec les variables d'environnement"
    silent: true
    cmds:
    - |
      export PROJECT_VERSION=$(jq -r .version package.json)
      echo "🛠️  {{.PROJECT_NAME}} v$PROJECT_VERSION - Stack lampy locale"
      echo "Environnement: {{.ENVIRONMENT}}"

  help:
    desc: "Affiche l'aide détaillée"
    aliases: [ h ]
    cmds:
    - task: default

  lampy:swarm-init:
    desc: "Initialise le projet en exécutant les tâches d'initialisation"
    silent: true
    cmds:
    - task: docker:swarm:init

  lampy:create-network:
    desc: "Crée les réseaux Docker nécessaires au projet"
    silent: true
    cmds:
    - task: docker:network:create
      vars:
        NETWORK_NAME: proxylampy
        NETWORK_DRIVER: overlay
    - task: docker:network:create
      vars:
        NETWORK_NAME: serverlampy
        NETWORK_DRIVER: overlay

  lampy:getpull-image:
    desc: "Télécharge les images Docker définies dans le docker-compose.yml"
    silent: true
    cmds:
    - task: docker:images:pull
      vars:
        COMPOSE_FILE: ./docker-compose.yml

  lampy:deploy:
    desc: "Déploie les stacks Docker définies dans les fichiers docker-compose"
    silent: true
    cmds:
    - task: docker:stack:deploy
      vars:
        COMPOSE_FILE: ./docker-compose.yml
        STACK_NAME: "{{.STACK_NAME}}"

  lampy:waiting:
    desc: "Attend que les services soient opérationnels"
    silent: true
    cmds:
    - task: docker:stack:check:containers:ready
      vars:
        SERVICES: "mercure,redis,mariadb,mailtest,phpmyadmin,portainer,traefik"
        STACK_NAME: "{{.STACK_NAME}}"

  lampy:ls:
    desc: "Liste les stacks et services Docker"
    silent: true
    cmds:
    - task: docker:stack:services
      vars:
        STACK_NAME: "{{.STACK_NAME}}"

  lampy:exec:
    desc: "Déploie la stack lampy complète (swarm, réseaux, images, deploy, attente, liste)"
    cmds:
    - task: lampy:swarm-init
    - task: lampy:create-network
    - task: lampy:getpull-image
    - task: lampy:deploy
    - task: lampy:waiting
    - task: lampy:ls

  lampy:bash:
    desc: "Ouvre un shell bash dans le conteneur MariaDB"
    internal: true
    silent: true
    vars:
      CONTAINER: '{{.CONTAINER | default ""}}'
    cmds:
    - task: docker:stack:shell
      vars:
        STACK_NAME: "{{.STACK_NAME}}"
        SERVICE_NAME: "{{.CONTAINER}}"

  bash:mariadb:
    desc: "Ouvre un shell bash dans le conteneur MariaDB"
    silent: true
    cmds:
    - task: lampy:bash
      vars:
        CONTAINER: mariadb

  bash:mercure:
    desc: "Ouvre un shell bash dans le conteneur Mercure"
    silent: true
    cmds:
    - task: lampy:bash
      vars:
        CONTAINER: mercure

  bash:redis:
    desc: "Ouvre un shell bash dans le conteneur Redis"
    silent: true
    cmds:
    - task: lampy:bash
      vars:
        CONTAINER: redis

  bash:mailtest:
    desc: "Ouvre un shell bash dans le conteneur MailTest"
    silent: true
    cmds:
    - task: lampy:bash
      vars:
        CONTAINER: mailtest

  bash:phpmyadmin:
    desc: "Ouvre un shell bash dans le conteneur phpMyAdmin"
    silent: true
    cmds:
    - task: lampy:bash
      vars:
        CONTAINER: phpmyadmin

  bash:portainer:
    desc: "Ouvre un shell bash dans le conteneur Portainer"
    silent: true
    cmds:
    - task: lampy:bash
      vars:
        CONTAINER: portainer

  bash:traefik:
    desc: "Ouvre un shell bash dans le conteneur Traefik"
    silent: true
    cmds:
    - task: lampy:bash
      vars:
        CONTAINER: traefik
