name: CI Pipeline
# `lint` : qualité statique (doit rester vert en local avant de merger).
# `launch` : déploiement Swarm réel — premier endroit où des secrets vides,
# un hash dashboard invalide ou une image cassée se voient (timeout `waiting`).
# Checklist avant déploiement (locale comme CI) : `.env` renseigné,
# `task env:validate` vert, `task lampy:dashboard-password` si le mot de
# passe dashboard par défaut ne convient plus.

on: 
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_INTERACTIVE: false
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_BUILDKIT: 1
  STACK_NAME: lampy
  # Optimisations npm
  NPM_CONFIG_PROGRESS: false
  # Optimisations Docker
  DOCKER_CLI_EXPERIMENTAL: enabled

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@v2

      # Note : pas de cache actions/cache sur node_modules — setup-node met
      # déjà en cache le cache npm, et `npm ci` rend tout node_modules
      # restauré obsolète/dangereux.
      - name: Install dependencies
        run: npm ci

      # Garde-fou : le middleware dashboard-auth ne doit jamais redevenir
      # un placeholder (hash invalide = dashboard injoignable, routeur en
      # erreur). Mot de passe : `task lampy:dashboard-password`.
      - name: Check dashboard-auth hash
        run: |
          if grep -q 'CHANGE_ME' traefik/middlewares.yml; then
            echo "❌ Placeholder dashboard-auth présent dans traefik/middlewares.yml"
            exit 1
          fi

      - name: lint all
        run: task lint:all

  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@v2

      # Note : pas de cache actions/cache sur node_modules — setup-node met
      # déjà en cache le cache npm, et `npm ci` rend tout node_modules
      # restauré obsolète/dangereux.
      - name: Install dependencies
        run: npm ci

      # Sans `.env`, `docker stack deploy` interpolerait des secrets vides
      # (ex. clés JWT Mercure → hub en échec → `lampy:waiting` en timeout).
      # `.env.example` fournit des valeurs de CI sûres.
      - name: Setup environment files
        run: cp .env.example .env

      - name: Validate environment files
        run: task env:validate

      - name: Initialize Docker environment
        run: |
          echo "🐳 Initialisation de l'environnement Docker..."
          task lampy:swarm-init
          task lampy:create-network
          task lampy:getpull-image
          task lampy:deploy
          task lampy:waiting
          echo "✅ Stack déployée"
