version: 2
# Scopes disjoints avec Renovate (qui pilote npm + .nvmrc) : Dependabot ne
# couvre ici que les sous-modules, Docker et les Actions GitHub.
updates:
- package-ecosystem: gitsubmodule
  directory: /
  schedule:
    interval: weekly
  labels:
  - "dependencies"
  - "submodule"
  open-pull-requests-limit: 10
# Docker Compose
- package-ecosystem: "docker-compose"
  directory: "/"
  schedule:
    interval: "weekly"
  labels:
  - "dependencies"
  - "docker"
  open-pull-requests-limit: 10
# GitHub Actions
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  labels:
  - "dependencies"
  - "github-actions"
  open-pull-requests-limit: 10
# 1️⃣ Dépendances Docker (docker-compose récupère les images du registry)
- package-ecosystem: "docker"
  directory: "/" # Dependabot va scanner docker-compose.yml
  schedule:
    interval: "weekly"
  labels:
  - "dependencies"
  - "docker"
